<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petal-PH | Messages</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-shell">
  <header class="topbar">
    <a class="brand" href="dashboard.html"><img class="brand-logo" src="logo.svg" alt="Petal-PH logo">Petal-PH</a>
    <div class="user-chip">
      <button class="icon-btn" title="Messages" aria-label="Messages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.6 1.3 4.9 3.3 6.5-.1 1-.6 2.4-1.6 3.4 1.9.1 3.6-.6 4.7-1.4 1.1.3 2.3.5 3.6.5 5.5 0 10-3.9 10-8.7S17.5 3 12 3z"/></svg>
      </button>
      <img id="avatarImg" class="avatar hidden" alt="Profile picture">
      <span id="avatarFallback" class="avatar avatar-fallback">U</span>
      <span id="userName" class="muted"></span>
      <button class="burger" id="backBtn" aria-label="Back to dashboard">&#8592;</button>
    </div>
  </header>

  <main class="chat-shell">
    <aside class="chat-contact">
      <img src="logo.svg" class="avatar" alt="Petal-PH Admin" style="background:#fff4f6">
      <div>
        <strong>Petal-PH Admin</strong>
        <div class="muted">Customer support — typically replies fast</div>
      </div>
      <ul class="chat-tips">
        <li>Ask about products and prices</li>
        <li>Follow up on your orders</li>
        <li>Get help with payments or delivery</li>
      </ul>
    </aside>

    <section class="chat-main">
      <div class="chat-head" id="chatHead">
        <img id="chatHeadAvatar" class="chat-head-avatar" src="logo.svg" alt="Petal-PH Admin">
        <div class="chat-head-identity">
          <div id="chatHeadName" class="chat-head-name">Petal-PH</div>
          <div id="chatHeadSub" class="chat-head-sub">Customer support</div>
        </div>
      </div>
      <div id="pinnedBar" class="chat-pinned-bar hidden"></div>
      <div id="chatMessages" class="chat-messages"></div>
      <div id="chatMsg" class="chat-msg" style="padding:0 .75rem;"></div>

      <form id="chatForm" class="chat-input">
        <input type="file" id="chatPhoto" accept="image/*" class="hidden" aria-label="Attach photo">
        <button type="button" class="chat-composer-btn" id="chatMicBtn" title="Voice message" aria-label="Voice message">🎤</button>
        <button type="button" class="chat-composer-btn" id="chatPhotoBtn" title="Attach photo" aria-label="Attach photo">📷</button>
        <textarea id="chatText" placeholder="Message Petal-PH Admin..." autocomplete="off" rows="1"></textarea>
        <button type="submit" class="chat-composer-send" id="chatSend" aria-label="Send">➤</button>
      </form>

      <div id="voiceRecorder" class="chat-voice-recorder hidden">
        <div class="chat-voice-status" id="voiceStatus">Recording&hellip;</div>
        <div class="chat-voice-timer" id="voiceTimer">0:00</div>
        <button type="button" class="chat-btn-danger" id="voiceStop">Stop</button>
        <button type="button" class="chat-btn-outline" id="voiceCancel">Cancel</button>
      </div>
      <div id="voicePreview" class="chat-voice-preview hidden">
        <audio id="voiceAudio" controls></audio>
        <div class="row" style="justify-content:flex-end; gap:.5rem; margin-top:.4rem;">
          <button type="button" class="chat-btn-outline" id="voiceRetry">Re-record</button>
          <button type="button" class="chat-btn" id="voiceSend">Send</button>
        </div>
      </div>

      <button type="button" class="chat-new-msg-btn hidden" id="newMsgBtn" aria-label="Go to newest messages">↓ New messages</button>
    </section>
  </main>

  <!-- Image lightbox -->
  <div id="imageModal" class="modal hidden">
    <button class="modal-x" id="imageClose" aria-label="Close" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <img id="imageModalImg" style="max-width:92vw; max-height:88vh; object-fit:contain; border-radius:8px;">
  </div>

  <!-- Message action cluster -->
  <div id="msgMenu" class="chat-msg-menu hidden">
    <div class="chat-msg-menu-items">
      <button type="button" class="chat-msg-menu-item" id="menuPin">📌 Pin</button>
      <button type="button" class="chat-msg-menu-item chat-btn-danger" id="menuUnsend">Unsend</button>
    </div>
  </div>

  <!-- Reaction picker -->
  <div id="msgPicker" class="chat-msg-picker hidden">
    <div class="chat-msg-picker-items" id="msgPickerItems"></div>
  </div>

  <!-- Reaction popover -->
  <div id="reactionPopover" class="chat-msg-popover hidden">
    <div class="chat-msg-popover-items" id="reactionPopoverItems"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0" integrity="sha384-NNePyabYRaJyedI6EQAY7SV5Z8/0sQkuQ5WVfhKm0H+j0KSugkI2ZMNzw/QtzAWz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/chat-ui.js"></script>
  <script>
    (async () => {
    await PetalApp.init();
    const session = PetalApp.requireAuth('user');
    if (!session) throw new Error('Unauthorized');
    let user = PetalApp.getMyProfile();
    if (!user) {
      await PetalApp.reload();
      user = PetalApp.getMyProfile();
    }
    if (!user) { PetalApp.logout(); }

    document.getElementById('backBtn').addEventListener('click', () => { window.location.href = 'dashboard.html'; });

    const img = document.getElementById('avatarImg');
    const fb = document.getElementById('avatarFallback');
    if (user.avatar) { img.src = user.avatar; img.classList.remove('hidden'); fb.classList.add('hidden'); }
    else { fb.textContent = (user.nickname || 'U').charAt(0).toUpperCase(); }
    document.getElementById('userName').textContent = user.nickname || '';

    const headName = document.getElementById('chatHeadName');
    const headSub = document.getElementById('chatHeadSub');
    if (headName) headName.textContent = 'Petal-PH';
    if (headSub) headSub.textContent = 'Customer support';

    PetalChatUI.init({
      me: user,
      meSender: 'user',
      other: { nickname: 'Petal-PH', avatar: 'logo.svg' },
      subText: 'Customer support',
      conversationUserId: user.id,
      markRead: () => PetalApp.markRead(user.id, 'user'),
      getMessages: () => PetalApp.getMessages(),
      sendText: (text) => PetalApp.sendMessage(user.id, 'user', text),
      sendImage: (file) => PetalApp.sendImage(user.id, 'user', file),
      sendVoice: (blob, seconds) => PetalApp.sendVoice(user.id, 'user', blob, seconds),
      unsend: (id) => PetalApp.unsendMessage(id),
      pin: (id, pinned) => PetalApp.pinMessage(id, pinned),
      react: (messageId, emoji) => PetalApp.reactToMessage(messageId, emoji),
      getAttachmentUrl: (path) => PetalApp.getAttachmentUrl(path),
      elements: {
        container: document.getElementById('chatMessages'),
        pinnedBar: document.getElementById('pinnedBar'),
        headerName: document.getElementById('chatHeadName'),
        headerSub: document.getElementById('chatHeadSub'),
        headerAvatar: document.getElementById('chatHeadAvatar'),
        form: document.getElementById('chatForm'),
        textarea: document.getElementById('chatText'),
        sendBtn: document.getElementById('chatSend'),
        photoBtn: document.getElementById('chatPhotoBtn'),
        photoInput: document.getElementById('chatPhoto'),
        micBtn: document.getElementById('chatMicBtn'),
        voiceRecorder: document.getElementById('voiceRecorder'),
        voicePreview: document.getElementById('voicePreview'),
        voiceAudio: document.getElementById('voiceAudio'),
        voiceTimer: document.getElementById('voiceTimer'),
        voiceStop: document.getElementById('voiceStop'),
        voiceCancel: document.getElementById('voiceCancel'),
        voiceRetry: document.getElementById('voiceRetry'),
        voiceSend: document.getElementById('voiceSend'),
        chatMsg: document.getElementById('chatMsg'),
        imageModal: document.getElementById('imageModal'),
        imageModalImg: document.getElementById('imageModalImg'),
        imageClose: document.getElementById('imageClose'),
        msgMenu: document.getElementById('msgMenu'),
        msgPicker: document.getElementById('msgPicker'),
        msgPickerItems: document.getElementById('msgPickerItems'),
        menuPin: document.getElementById('menuPin'),
        menuUnsend: document.getElementById('menuUnsend'),
        newMsgBtn: document.getElementById('newMsgBtn'),
        reactionPopover: document.getElementById('reactionPopover'),
        reactionPopoverItems: document.getElementById('reactionPopoverItems'),
      }
    });

    setInterval(async () => {
      try {
        await PetalApp.loadOwn();
        await PetalChatUI.refresh();
      } catch (err) {
        console.warn('Petal-PH: chat poll failed', err);
      }
    }, 10000);
    })();
  </script>
</body>
</html>
